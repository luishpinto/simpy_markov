[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpy-markov"
version = "0.2.0"
description = "Configurable manufacturing process simulation with SimPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1,<5",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
]

[project.urls]
Repository = "https://github.com/luishpinto/simpy_markov"

[project.scripts]
simpy-markov = "simpy_markov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simpy_markov = ["data/*.md"]
